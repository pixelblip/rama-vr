<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR test</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene
  background="color: #7a828a"
  webxr="optionalFeatures: local-floor, bounded-floor"
  vr-mode-ui="enabled: true">
  <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#5a8a48"></a-plane>
  <a-box position="0 1.3 -2" color="#ff3333"></a-box>
  <a-sky color="#7a828a"></a-sky>
  <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
</a-scene>
</body>
</html>
